name: CI

on:
  push:
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # `moonbitlang/async` links OpenSSL for its TLS support.
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: moon version
        run: moon version --all

      # A fresh runner has an empty registry index, so dependencies such as
      # `moonbitlang/async` cannot be resolved before the first update.
      - name: moon update
        run: moon update

      - name: moon fmt --check
        run: moon fmt --check

      # Native is the default target: it covers the core package and the
      # HTTP integration tests (transport_http, cmd/httpdemo).
      - name: moon check (native)
        run: moon check

      - name: moon test (native)
        run: moon test

      # The core package stays target agnostic; keep wasm-gc and js green.
      - name: moon check (wasm-gc)
        run: moon check --target wasm-gc

      - name: moon test (wasm-gc)
        run: moon test --target wasm-gc

      - name: moon check (js)
        run: moon check --target js
